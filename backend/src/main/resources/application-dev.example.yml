# 开发环境：全局放行所有请求（含 WebSocket 升级 /api/v1/ws/**，绕过 JWT 校验）
security:
  permit-all: true

spring:
  datasource:
    url: jdbc:mysql://47.109.141.71:3306/serverops?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ServerOps
    password: 请填写
  # 邮件 SMTP 配置（真实发件人凭据，覆盖 application.yml 中的占位值）
  mail:
    host: smtp.qq.com              # SMTP 服务器地址（QQ:smtp.qq.com / 163:smtp.163.com / 阿里云:smtp.qiye.aliyun.com）
    port: 465                      # 端口（SSL=465 / STARTTLS=587）
    username: 3494924679@qq.com    # 发件人邮箱账号
    password: 请填写 # SMTP 授权码（非邮箱登录密码，需在邮箱后台开启SMTP服务后获取）
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true              # 开启SMTP认证
          # 端口 465 走 SSL，不要同时开 STARTTLS（两者冲突会导致 QQ SMTP 报 Authentication failed）
          # STARTTLS 仅用于 587 端口；若改用 587 请启用下方 starttls.enable 并关闭 ssl.enable
          # starttls:
          #   enable: true
          ssl:
            enable: true         # 启用SSL（465端口必填）
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          connectiontimeout: 5000  # 连接超时(ms)
          timeout: 5000            # 邮件发送超时(ms)
          writetimeout: 5000       # 数据写入超时(ms)
# InfluxDB 配置
influxdb:
  url:  http://47.109.141.71:8086
  token: 请填写

ai:
  analysis:
    ollama:
      # DeepSeek 官方端点（已含 /v1，代码会自动补 /chat/completions）
      base-url: https://api.deepseek.com/v1
      # DeepSeek API Key（必填，可在 https://platform.deepseek.com 申请）
      api-key: 请填写
      # 模型：deepseek-v4-flash（V4 Flash，支持 JSON 模式）
      model: deepseek-v4-flash
      timeout-ms: 120000
      temperature: 0.2
      # 若改用 deepseek-reasoner（R1 推理模型），设为 false 以规避 response_format 报错
      json-mode: true
    embedding:
      base-url: http://192.168.31.182:8082/v1
      model: bge-m3
      timeout-ms: 30000
    vector:
      chroma:
        base-url: http://192.168.31.182:8000
        collection: serverops_alert_analysis
        top-k: 5
        timeout-ms: 30000



