server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: server-ops
  profiles:
    active: dev

  # Jackson 全局序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # MySQL 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://localhost:3306/serverops?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
#    username: root
#    password: password
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:                     # 无密码可留空或删除此行
      database: 0                   # 使用的数据库索引，默认0
      timeout: 5000ms               # 命令执行超时时间
      connect-timeout: 3000ms       # 连接建立超时时间

  # 邮件 SMTP 配置
  mail:
    host: smtp.qq.com              # SMTP 服务器地址（QQ:smtp.qq.com / 163:smtp.163.com / 阿里云:smtp.qiye.aliyun.com）
    port: 465                      # 端口（SSL=465 / STARTTLS=587）
    username: emial@qq.com         # 发件人邮箱账号
    password: password             # SMTP 授权码（非邮箱登录密码，需在邮箱后台开启SMTP服务后获取）
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true              # 开启SMTP认证
          starttls:
            enable: false         # 465走SSL必须显式关闭STARTTLS，否则与SSL冲突导致QQ报Authentication failed
          ssl:
            enable: true         # 启用SSL（465端口必填）
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          connectiontimeout: 5000  # 连接超时(ms)
          timeout: 5000            # 邮件发送超时(ms)
          writetimeout: 5000       # 数据写入超时(ms)

# 邮件自定义业务配置（由 MailProperties 类绑定）
mail-custom:
  from-name: ServerOps监控告警   # 发件人显示名称
  retry-count: 3                  # 发送失败重试次数
  retry-interval: 2000            # 重试间隔(ms)

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl     # SQL 日志走 SLF4J，统一套用 Spring Boot 日志格式（带时间戳/线程/logger）
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发阶段直接裸打 SQL（无格式），生产环境注释掉
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# InfluxDB 配置
influxdb:
#  url: http://localhost:8086
#  token:
  org: org
  bucket: ServerOps
  batch-size: 1000                 # 批量写入阈值
  flush-interval: 5000             # 批量刷新间隔(ms)

# WebSocket 实时推送配置
ws:
  push-interval-ms: 1000           # 指标定时推送周期(ms)，向前端推送实时数据的时间间隔
  stale-threshold-ms: 20000        # Agent 失联判定阈值(ms)：超过该时长无新数据点即视为 Agent 停止上报

# JWT 自定义配置
jwt:
  secret: YourSuperSecretKeyAtLeast256BitsLongForHS256Algorithm!!
  expiration: 86400000             # Token有效期(ms)，默认24小时
  header: Authorization
  prefix: "Bearer "

# Agent 通信 Token (静态密钥，Agent端需保持一致)
agent:
  token: AgentSecureToken2024!

# AI 告警分析（对接 DeepSeek 云端 API，OpenAI 兼容 /v1/chat/completions）
ai:
  analysis:
    ollama:
      # 阿里云百炼 OpenAI 兼容端点（代码会自动补 /chat/completions）
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # 百炼 API Key（必填，在 https://bailian.console.aliyun.com/ 获取）
      api-key: "sk-你的百炼APIKey"
      # 推荐模型：qwen-plus / qwen-turbo / qwen-max
      # qwen-plus 性价比高且稳定支持 JSON Mode
      model: qwen-plus
      timeout-ms: 120000
      temperature: 0.2
      # Qwen 系列通过 OpenAI 兼容接口调用时支持 response_format
      json-mode: true
    embedding:
      # 百炼 Embedding OpenAI 兼容端点
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # 推荐使用 text-embedding-v3（支持多语言，维度可调）
      model: text-embedding-v3
      # 复用同一个百炼 API Key
      api-key: "sk-你的百炼APIKey"
      timeout-ms: 30000
    vector:
      chroma:
        base-url: http://localhost:8082
        collection: serverops_alert_analysis_v3
        top-k: 5
        timeout-ms: 30000

# 日志配置
logging:
  level:
    root: info
    com.qingruan.mapper: debug  # Mapper层SQL日志级别（SQL 经 SLF4J 输出，需 debug 级别才显示）

