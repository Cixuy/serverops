[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "serverops-client"
version = "0.1.0"
description = "ServerOps host monitoring agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "PySide6>=6.7,<7",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
serverops-client = "serverops_client.main:main"

[tool.hatch.build.targets.wheel]
packages = ["serverops_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
